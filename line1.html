<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>1号线 - 长福轨道交通</title>
  <style>
    :root{--bg:#f7f9fb;--primary:#0b71d5;--muted:#6b7280}
    body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#0f172a; margin:0}
    .container{max-width:720px;margin:48px auto;padding:24px;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(11,23,52,0.08)}
    h1{margin:0 0 8px;font-size:24px}
    .meta{color:var(--muted);font-size:14px;margin-bottom:12px}
    .section{background:#f1f5f9;padding:12px;border-radius:8px;margin-bottom:10px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #e6eef6;text-align:left}
    a.btn{display:inline-block;padding:10px 14px;border-radius:8px;text-decoration:none;color:#fff;background:#A62E37;font-weight:600}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main class="container">
    <h1>1号线 <small style="color:#A62E37;font-weight:700">（运营中）</small></h1>
    <div class="meta">站点：15 · 运营时间：06:15 - 23:35</div>

    <div class="section">
      <h2 style="margin-top:0">车站列表</h2>
      <table>
        <thead>
          <tr><th>序号</th><th>车站名</th><th>换乘</th></tr>
        </thead>
        <tbody>
          <tr><td>4</td><td>木溪村</td><td>换乘: 7号线</td></tr>
          <tr><td>6</td><td>桦甸</td><td>无</td></tr>
          <tr><td>7</td><td>南原大道</td><td>无</td></tr>
          <tr><td>8</td><td>知音</td><td>无</td></tr>
          <tr><td>9</td><td>云樱大道</td><td>换乘: 3号线</td></tr>
          <tr><td>11</td><td>长福火车站</td><td>换乘: 6号线</td></tr>
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2 style="margin-top:0">时刻表（示例）</h2>
      <table>
        <thead><tr><th>方向</th><th>首班</th><th>末班</th><th>峰时间隔</th></tr></thead>
        <tbody>
          <tr><td>木溪村 → 长福火车站</td><td>06:30</td><td>23:00</td><td>5 分钟</td></tr>
          <tr><td>长福火车站 → 木溪村</td><td>06:30</td><td>23:10</td><td>5 分钟</td></tr>
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2 style="margin-top:0">票价（示例）</h2>
      <p>全线网基础票价 2 元，按区间计价，最长 12 元。</p>
    </div>

    <div style="margin-top:8px">
      <a class="btn" href="lines.html">返回线路列表</a>
    </div>

    <footer>项目仓库：mc0427/Changfu-Rail-Transit</footer>
  </main>
</body>
</html>
