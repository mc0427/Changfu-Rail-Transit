<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>车站时刻表 - 长福轨道交通</title>
  <style>
    :root{--bg:#f7f9fb;--primary:#0b71d5;--muted:#6b7280}
    body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#0f172a; margin:0}
    .container{max-width:720px;margin:48px auto;padding:24px;text-align:center;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(11,23,52,0.08)}
    h1{margin:0 0 8px;font-size:24px}
    p.lead{color:var(--muted);margin-top:0}
    .actions{display:flex;flex-direction:column;gap:14px;margin-top:20px}
    a.btn{display:inline-block;padding:12px 16px;border-radius:10px;text-decoration:none;color:#fff;background:var(--primary);font-weight:600}
    a.btn.secondary{background:#6b7280}
    .search-row{display:flex;justify-content:center;margin-top:12px;gap:8px;align-items:center}
    .search-row input{padding:10px 12px;border-radius:8px;border:1px solid #e6eefb;width:260px}
    .station-list{margin-top:18px;text-align:left}
    .initial{font-weight:700;margin-top:16px}
    .station{display:inline-block;margin:6px 8px;padding:8px 12px;border-radius:10px;background:#eef6ff;color:var(--primary);cursor:pointer;border:0}
    .station:active{transform:translateY(1px)}
    #timetable{margin-top:20px;color:var(--muted)}
    footer{margin-top:26px;color:var(--muted);font-size:13px}
    .meta{margin-top:8px;color:var(--muted);font-size:14px}
    .now-panel{margin-top:10px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
    .now-panel .chip{background:#f1f5f9;padding:8px 10px;border-radius:8px;color:var(--muted)}
    @media(min-width:520px){.actions{flex-direction:row;justify-content:center}}
  </style>
</head>
<body>
  <main class="container">
    <h1>车站时刻表</h1>
    <p class="lead">点击任一车站查看时刻表（按汉字拼音音序排序）</p>

    <div class="actions">
      <a class="btn secondary" href="index.html">返回首页</a>
    </div>

    <div class="search-row" aria-label="搜索车站">
      <input id="searchInput" type="search" placeholder="搜索车站名或拼音（例如：muxicun）" aria-label="搜索车站">
      <button id="clearSearch" class="station" type="button">清除</button>
    </div>

    <div id="stationContainer" class="station-list" aria-live="polite"></div>

    <div id="timetable">尚未选择车站。</div>

    <footer>项目仓库：mc0427/Changfu-Rail-Transit</footer>
  </main>

  <script>
    // 基本数据
    const stations = [
      {name: '木溪村', pinyin: 'muxicun'},
      {name: '云栖石镜', pinyin: 'yunqishijing'},
      {name: '桦甸', pinyin: 'huadian'},
      {name: '南原大道', pinyin: 'nanyuandadao'},
      {name: '知音', pinyin: 'zhiyin'},
      {name: '云樱大道', pinyin: 'yunyingdadao'},
      {name: '长福火车站', pinyin: 'changfuhuochezhan'}
    ];

    const timetables = {};

    // 工具：时间转换
    function timeToMinutes(t){
      const parts = String(t).split(':').map(Number);
      if (parts.length < 2) return 0;
      return parts[0]*60 + parts[1];
    }
    function minutesToTime(m){
      m = Math.round(m);
      const hh = String(Math.floor(m/60)).padStart(2,'0');
      const mm = String(m%60).padStart(2,'0');
      return `${hh}:${mm}`;
    }

    // 站点到目标的偏移（分钟）
    const offsetsToChangfu = { muxicun:0, yunqishijing:1, huadian:3, nanyuandadao:4, zhiyin:6, yunyingdadao:8, changfuhuochezhan:10 };
    const offsetsToMuxicun = { changfuhuochezhan:0, yunyingdadao:2, zhiyin:4, nanyuandadao:7, huadian:9, yunqishijing:11, muxicun:12 };

    function generateTimetablesToChangfu(){
      const start = timeToMinutes('06:15');
      const end = timeToMinutes('23:00');
      const base = [];
      for (let t = start; t <= end; t += 5) base.push(minutesToTime(t));
      for (const [key, off] of Object.entries(offsetsToChangfu)){
        const times = base.map(bt => minutesToTime(timeToMinutes(bt) + off));
        timetables[key] = timetables[key] || {};
        timetables[key]['往长福火车站'] = times;
      }
    }

    function generateTimetablesToMuxicun(){
      const start = timeToMinutes('06:30');
      const end = timeToMinutes('23:10');
      const base = [];
      for (let t = start; t <= end; t += 5) base.push(minutesToTime(t));
      for (const [key, off] of Object.entries(offsetsToMuxicun)){
        const times = base.map(bt => minutesToTime(timeToMinutes(bt) + off));
        timetables[key] = timetables[key] || {};
        timetables[key]['往木溪村'] = times;
      }
    }

    function generateShortTurnToHuadian(){
      // 末班后的短倒班示例（23:10, 23:20, 23:30 出发）
      const shortStarts = ['23:10','23:20','23:30'];
      const route = ['muxicun','yunqishijing','huadian'];
      // 假设 offsetsToChangfu 中的偏移可用
      for (const station of route){
        const off = offsetsToChangfu[station] || 0;
        const times = shortStarts.map(bt => minutesToTime(timeToMinutes(bt) + off));
        timetables[station] = timetables[station] || {};
        timetables[station]['末班短转（示例）'] = times;
      }
    }

    // 生成表
    generateTimetablesToChangfu();
    generateTimetablesToMuxicun();
    generateShortTurnToHuadian();

    // 渲染站点列表
    const stationContainer = document.getElementById('stationContainer');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearch');
    const timetableEl = document.getElementById('timetable');

    function renderStations(){
      const q = (searchInput.value || '').trim().toLowerCase();
      const filtered = stations.filter(s => {
        if (!q) return true;
        return s.name.includes(q) || s.pinyin.includes(q);
      }).slice().sort((a,b) => a.pinyin.localeCompare(b.pinyin, 'zh-Hans-u-co-pinyin'));

      const grouped = {};
      for (const s of filtered){
        const initial = s.pinyin.charAt(0).toUpperCase();
        if (!grouped[initial]) grouped[initial] = [];
        grouped[initial].push(s);
      }

      stationContainer.innerHTML = '';
      if (filtered.length === 0){
        stationContainer.innerHTML = '<div class="initial">—</div><div>未找到匹配的车站。</div>';
        return;
      }

      for (const initial of Object.keys(grouped).sort()){
        const h = document.createElement('div'); h.className='initial'; h.textContent=initial; stationContainer.appendChild(h);
        const row = document.createElement('div');
        for (const s of grouped[initial]){
          const btn = document.createElement('button');
          btn.type='button';
          btn.className='station';
          btn.textContent = s.name;
          btn.dataset.pinyin = s.pinyin;
          btn.addEventListener('click', ()=> showTimetable(s));
          row.appendChild(btn);
        }
        stationContainer.appendChild(row);
      }
    }

    // 查找上一班/下一班
    function findPrevNext(times){
      if (!Array.isArray(times) || times.length === 0) return { prev: null, next: null, now: null };
      const now = new Date();
      const nowSeconds = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
      let prev = null, next = null;
      for (let i=0;i<times.length;i++){
        const tSec = timeToMinutes(times[i]) * 60;
        if (tSec <= nowSeconds) prev = times[i];
        if (tSec > nowSeconds) { next = times[i]; break; }
      }
      const nowMinStr = minutesToTime(Math.floor(nowSeconds/60));
      return { prev, next, now: nowMinStr };
    }

    // 渲染时刻表（点击站点）
    function showTimetable(station){
      const key = station.pinyin;
      const lineName = '1号线';
      if (timetables[key]){
        const directions = Object.keys(timetables[key]);
        if (directions.length === 1){
          const dir = directions[0];
          const times = timetables[key][dir];
          timetableEl.innerHTML = `<strong>${station.name}</strong>（${lineName}） ${dir} 的今日时刻表：<div style="margin-top:8px">${renderTimeList(times)}</div>`;
          renderNowPanel(timetableEl, times);
        } else {
          let html = `<strong>${station.name}</strong>（${lineName}） 的今日时刻表：<br>`;
          for (const dir of directions){
            html += `<div style="margin:8px 0"><button type="button" class="station" data-dir="${dir}">${dir}</button></div>`;
          }
          html += '<div id="directionTimes" style="margin-top:8px;color:var(--muted)"></div>';
          timetableEl.innerHTML = html;
          timetableEl.querySelectorAll('button.station').forEach(b=>{
            b.addEventListener('click', ()=> {
              const dir = b.dataset.dir;
              const times = timetables[key][dir] || [];
              document.getElementById('directionTimes').innerHTML = `${dir}：<div style="margin-top:8px">${renderTimeList(times)}</div>`;
              renderNowPanel(document.getElementById('directionTimes'), times);
            });
          });
        }
      } else {
        timetableEl.innerHTML = `<strong>${station.name}</strong>（${lineName}） 的今日时刻表（示例）：<br><ul>
          <li>06:15 — 首班车</li>
          <li>07:30 — 高峰班次</li>
          <li>23:00 — 末班车（示例）</li>
        </ul>`;
      }
    }

    // 渲染当前/上一班/下一班面板
    function renderNowPanel(containerEl, times){
      // 清理已有面板（避免重复）
      const existing = containerEl.querySelector('.now-panel-container');
      if (existing) existing.remove();

      const info = findPrevNext(times);
      const panel = document.createElement('div');
      panel.className = 'meta now-panel-container';
      const nowText = `当前时间：${info.now || '--:--'}`;
      const prevText = info.prev ? `上一班：${info.prev}` : '上一班：—（首班前）';
      const nextText = info.next ? `下一班：${info.next}` : '下一班：—（末班后或无）';
      panel.innerHTML = `<div class="now-panel">
        <div class="chip" id="nowChip">${nowText}</div>
        <div class="chip" id="prevChip">${prevText}</div>
        <div class="chip" id="nextChip">${nextText}</div>
        <button id="refreshTimes" class="station" type="button" style="background:#fff;color:var(--primary);border:1px solid #e6eefb">刷新</button>
      </div>`;
      containerEl.appendChild(panel);

      // 实时更新当前时间显示（每秒）
      let intervalId = null;
      function updatePanel(){
        const now = new Date();
        const nowSeconds = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
        const nowMinStr = minutesToTime(Math.floor(nowSeconds/60));
        const info2 = findPrevNext(times);
        panel.querySelector('#nowChip').textContent = `当前时间：${nowMinStr}`;
        panel.querySelector('#prevChip').textContent = info2.prev ? `上一班：${info2.prev}` : '上一班：—（首班前）';
        panel.querySelector('#nextChip').textContent = info2.next ? `下一班：${info2.next}` : '下一班：—（末班后或无）';
      }
      updatePanel();
      intervalId = setInterval(updatePanel, 1000);

      panel.querySelector('#refreshTimes').addEventListener('click', ()=>{
        if (intervalId) clearInterval(intervalId);
        panel.remove();
        renderNowPanel(containerEl, times);
      });
    }

    // 将时刻数组渲染为行/块
    function renderTimeList(times){
      if (!times || times.length === 0) return '<div>暂无时刻信息。</div>';
      const perLine = 8;
      let html = '<div style="text-align:left;display:inline-block;color:var(--muted)">';
      for (let i=0;i<times.length;i++){
        html += `<span style="display:inline-block;width:90px;padding:4px 6px">${times[i]}</span>`;
        if ((i+1) % perLine === 0) html += '<br>';
      }
      html += '</div>';
      return html;
    }

    // 事件绑定与初始渲染
    searchInput.addEventListener('input', renderStations);
    clearSearchBtn.addEventListener('click', ()=>{ searchInput.value=''; renderStations(); searchInput.focus(); });

    renderStations();
  </script>
</body>
</html>
