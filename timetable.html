<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>车站时刻表 - 长福轨道交通</title>
  <style>
    :root{--bg:#f7f9fb;--primary:#0b71d5;--muted:#6b7280}
    body{font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#0f172a; margin:0}
    .container{max-width:720px;margin:48px auto;padding:24px;text-align:center;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(11,23,52,0.08)}
    h1{margin:0 0 8px;font-size:24px}
    p.lead{color:var(--muted);margin-top:0}
    .actions{display:flex;flex-direction:column;gap:14px;margin-top:20px}
    a.btn{display:inline-block;padding:12px 16px;border-radius:10px;text-decoration:none;color:#fff;background:var(--primary);font-weight:600}
    a.btn.secondary{background:#6b7280}
    .controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px}
    select{padding:8px 10px;border-radius:8px;border:1px solid #e6eefb;background:#fff}
    .station-list{margin-top:18px;text-align:left}
    .initial{font-weight:700;margin-top:16px}
    .station{display:inline-block;margin:6px 8px;padding:8px 12px;border-radius:10px;background:#eef6ff;color:var(--primary);cursor:pointer;border:0}
    .station:active{transform:translateY(1px)}
    #timetable{margin-top:20px;color:var(--muted)}
    footer{margin-top:26px;color:var(--muted);font-size:13px}
    .meta{margin-top:8px;color:var(--muted);font-size:14px}
    .now-panel{margin-top:10px;display:flex;gap:12px;justify-content:center;align-items:center}
    .now-panel .chip{background:#f1f5f9;padding:8px 10px;border-radius:8px;color:var(--muted)}
    @media(min-width:520px){.actions{flex-direction:row;justify-content:center}}
  </style>
</head>
<body>
  <main class="container">
    <h1>车站时刻表</h1>
    <p class="lead">请选择线路与车站查看时刻表（车站按汉字拼音首字母排序）</p>

    <div class="actions">
      <a class="btn secondary" href="index.html">返回首页</a>
    </div>

    <div class="controls">
      <label for="lineSelect">线路：</label>
      <select id="lineSelect" aria-label="选择线路"></select>
    </div>

    <div id="stationContainer" class="station-list" aria-live="polite"></div>

    <div id="timetable">尚未选择车站。</div>

    <footer>项目仓库：mc0427/Changfu-Rail-Transit</footer>
  </main>

  <script>
    // 线路定义（目前只有1号线）
    const lines = [
      { id: '1', name: '1号线', color: '#0b71d5' }
    ];

    // 初始录入车站（name: 中文名, pinyin: 用于排序的拼音, line: 所属线路id）
    const stations = [
      {name: '木溪村', pinyin: 'muxicun', line: '1'},
      {name: '云栖石镜', pinyin: 'yunqishijing', line: '1'},
      {name: '桦甸', pinyin: 'huadian', line: '1'},
      {name: '南原大道', pinyin: 'nanyuandadao', line: '1'},
      {name: '知音', pinyin: 'zhiyin', line: '1'},
      {name: '云樱大道', pinyin: 'yunyingdadao', line: '1'},
      {name: '长福火车站', pinyin: 'changfuhuochezhan', line: '1'}
    ];

    // 当前选中线路（默认 1）
    let selectedLine = '1';

    // 统一的时刻表对象（将由下面生成器填充）
    const timetables = {};

    // 时间处理辅助函数
    function timeToMinutes(t){
      const [h,m] = t.split(':').map(Number);
      return h*60 + m;
    }
    function minutesToTime(m){
      const hh = String(Math.floor(m/60)).padStart(2,'0');
      const mm = String(m%60).padStart(2,'0');
      return `${hh}:${mm}`;
    }

    // 各站相对于木溪村的出发时间偏移（往长福火车站方向，按示例对齐）
    // 示例首班对应关系：木溪村 06:30 -> 长福火车站 06:40，因此偏移为：
    // muxicun:0, yunqishijing:+1, huadian:+3, nanyuandadao:+4, zhiyin:+6, yunyingdadao:+8, changfuhuochezhan:+10
    const offsetsToChangfu = {
      muxicun: 0,
      yunqishijing: 1,
      huadian: 3,
      nanyuandadao: 4,
      zhiyin: 6,
      yunyingdadao: 8,
      changfuhuochezhan: 10
    };

    // 各站相对于长福火车站的出发时间偏移（往木溪村方向，保持原有）
    const offsetsToMuxicun = {
      changfuhuochezhan: 0,
      yunyingdadao: 2,
      zhiyin: 4,
      nanyuandadao: 7,
      huadian: 9,
      yunqishijing: 11,
      muxicun: 12
    };

    // 生成 1 号线往长福火车站方向的时刻表
    // 规则：木溪村 06:15 首班；从 06:15 起每 5 分钟一班，直到 23:00（包含）。
    function generateTimetablesToChangfu(){
      const start = timeToMinutes('06:15');
      const end = timeToMinutes('23:00');
      const base = [];
      for (let t = start; t <= end; t += 5) {
        base.push(minutesToTime(t));
      }

      for (const [key, off] of Object.entries(offsetsToChangfu)) {
        const times = base.map(bt => minutesToTime(timeToMinutes(bt) + off));
        timetables[key] = timetables[key] || {};
        timetables[key]['往长福火车站'] = times;
      }
    }

    // 生成 1 号线往木溪村方向的时刻表
    // 规则：长福火车站 06:30 首班；从 06:30 起每 5 分钟一班，直到 23:10（包含）。
    function generateTimetablesToMuxicun(){
      const start = timeToMinutes('06:30');
      const end = timeToMinutes('23:10');
      const base = [];
      for (let t = start; t <= end; t += 5) {
        base.push(minutesToTime(t));
      }

      for (const [key, off] of Object.entries(offsetsToMuxicun)) {
        const times = base.map(bt => minutesToTime(timeToMinutes(bt) + off));
        timetables[key] = timetables[key] || {};
        timetables[key]['往木溪村'] = times;
      }
    }

    // 立即生成时刻表（两个方向）
    generateTimetablesToChangfu();
    generateTimetablesToMuxicun();

    // 渲染线路下拉菜单 & 站点列表等 UI
    const lineSelect = document.getElementById('lineSelect');
    for (const l of lines) {
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = l.name;
      lineSelect.appendChild(opt);
    }
    lineSelect.value = selectedLine;
    lineSelect.addEventListener('change', ()=> {
      selectedLine = lineSelect.value;
      renderStations();
      document.getElementById('timetable').innerHTML = '尚未选择车站。';
    });

    function renderStations() {
      // 过滤出当前线路的车站
      const filtered = stations.filter(s => s.line === selectedLine);

      // 按拼音排序（使用拼音排序规则）
      filtered.sort((a,b)=> a.pinyin.localeCompare(b.pinyin, 'zh-Hans-u-co-pinyin'));

      // 按首字母分组
      const grouped = {};
      for (const s of filtered) {
        const initial = s.pinyin.charAt(0).toUpperCase();
        if (!grouped[initial]) grouped[initial] = [];
        grouped[initial].push(s);
      }

      const container = document.getElementById('stationContainer');
      container.innerHTML = '';

      for (const initial of Object.keys(grouped).sort()) {
        const h = document.createElement('div');
        h.className = 'initial';
        h.textContent = initial;
        container.appendChild(h);

        const row = document.createElement('div');
        for (const s of grouped[initial]) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'station';
          btn.textContent = s.name;
          btn.dataset.pinyin = s.pinyin;
          btn.addEventListener('click', ()=> showTimetable(s));
          row.appendChild(btn);
        }
        container.appendChild(row);
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="initial">—</div><div>当前线路暂无车站。</div>';
      }
    }

    // 寻找上一班和下一班（基于本地当前时间）
    function findPrevNext(times){
      const now = new Date();
      const nowMinutes = now.getHours()*60 + now.getMinutes();

      let prev = null;
      let next = null;
      for (let i=0;i<times.length;i++){
        const tMin = timeToMinutes(times[i]);
        if (tMin <= nowMinutes) {
          prev = times[i];
        }
        if (tMin > nowMinutes) {
          next = times[i];
          break;
        }
      }

      return { prev, next, now: minutesToTime(nowMinutes) };
    }

    // 显示时刻表并附带上一班/下一班信息
    function showTimetable(station){
      const el = document.getElementById('timetable');
      const key = station.pinyin;
      const lineName = lines.find(l=>l.id===station.line).name;

      if (timetables[key]) {
        const directions = Object.keys(timetables[key]);
        if (directions.length === 1) {
          const dir = directions[0];
          const times = timetables[key][dir];
          el.innerHTML = `<strong>${station.name}</strong>（${lineName}） ${dir} 的今日时刻表：<br>` + renderTimeList(times);
          renderNowPanel(el, times);
        } else {
          let html = `<strong>${station.name}</strong>（${lineName}） 的今日时刻表：<br>`;
          for (const dir of directions) {
            html += `<div style="margin:8px 0"><button type="button" class="station" data-dir="${dir}">${dir}</button></div>`;
          }
          html += '<div id="directionTimes" style="margin-top:8px;color:var(--muted)"></div>';
          el.innerHTML = html;
          el.querySelectorAll('button.station').forEach(b=>{
            b.addEventListener('click', ()=>{
              const dir = b.dataset.dir;
              const times = timetables[key][dir];
              document.getElementById('directionTimes').innerHTML = renderTimeList(times) + renderNowPanelInline(times);
            });
          });
        }
      } else {
        el.innerHTML = `<strong>${station.name}</strong>（${lineName}） 的今日时刻表（示例）：<br><ul>
        <li>06:10 — 首班车</li>
        <li>07:30 — 高峰班次</li>
        <li>12:00 — 平峰班次</li>
        <li>18:20 — 末班车</li>
      </ul>`;
      }
    }

    // 渲染现在/上一班/下一班面板
    function renderNowPanel(containerEl, times){
      const info = findPrevNext(times);
      const nowText = `当前时间：${info.now}`;
      const prevText = info.prev ? `上一班：${info.prev}` : '上一班：—（首班前）';
      const nextText = info.next ? `下一班：${info.next}` : '下一班：—（末班已过）';

      const panel = document.createElement('div');
      panel.className = 'meta';
      panel.innerHTML = `<div class="now-panel"><div class="chip">${nowText}</div><div class="chip">${prevText}</div><div class="chip">${nextText}</div><button id="refreshTimes" type="button" class="station" style="margin-left:6px">刷新</button></div>`;

      containerEl.appendChild(panel);

      const refreshBtn = panel.querySelector('#refreshTimes');
      refreshBtn.addEventListener('click', ()=>{
        panel.remove();
        renderNowPanel(document.getElementById('timetable'), times);
      });

      const intervalId = setInterval(()=>{
        if (!document.body.contains(panel)) {
          clearInterval(intervalId);
          return;
        }
        const newInfo = findPrevNext(times);
        panel.querySelectorAll('.chip')[0].textContent = `当前时间：${newInfo.now}`;
        panel.querySelectorAll('.chip')[1].textContent = newInfo.prev ? `上一班：${newInfo.prev}` : '上一班：—（首班前）';
        panel.querySelectorAll('.chip')[2].textContent = newInfo.next ? `下一班：${newInfo.next}` : '下一班：—（末班已过）';
      }, 30000);
    }

    function renderNowPanelInline(times){
      const info = findPrevNext(times);
      const nowText = `当前时间：${info.now}`;
      const prevText = info.prev ? `上一班：${info.prev}` : '上一班：—（首班前）';
      const nextText = info.next ? `下一班：${info.next}` : '下一班：—（末班已过）';

      return `<div class="meta"><div class="now-panel"><div class="chip">${nowText}</div><div class="chip">${prevText}</div><div class="chip">${nextText}</div></div></div>`;
    }

    function renderTimeList(times){
      if (!times || times.length === 0) return '<div>暂无时刻信息。</div>';
      const perLine = 8;
      let html = '<div style="text-align:left;display:inline-block;color:var(--muted)">';
      for (let i=0;i<times.length;i++){
        if (i % perLine === 0) html += '<div style="margin:6px 0">';
        html += `<span style="display:inline-block;width:72px">${times[i]}</span>`;
        if (i % perLine === perLine-1 || i === times.length-1) html += '</div>';
      }
      html += '</div>';
      return html;
    }

    // 初次渲染
    renderStations();
  </script>
</body>
</html>
